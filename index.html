<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sampple</title>
<style>:root{color-scheme:light dark;--bg:#F5F6F8;--surface:#fff;--text:#141A21;--muted:#5A6573;--line:#E2E6EC;
--brand:#0B7F8A;--on-brand:#fff;--tint:rgba(11,127,138,.1);--tap:#E8554D;--halo:rgba(232,85,77,.45);--chip:rgba(240,100,92,.15);--chipq:rgba(90,101,115,.13);
--shadow:0 1px 2px rgba(20,26,33,.05),0 8px 24px rgba(20,26,33,.07);
--bezel:#C6CDD7;--scr:#EEF1F5;--scard:#fff;--sline:#D5DBE3;--stext:#27303A;--spill:#DDE2E9}
@media (prefers-color-scheme:dark){:root{--bg:#0E1113;--surface:#191D21;--text:#EEF1F4;--muted:#9CA6B2;--line:#2A3037;
--brand:#35BDB0;--on-brand:#04211E;--tint:rgba(53,189,176,.15);--tap:#FF8076;--halo:rgba(255,128,118,.5);--chip:rgba(255,128,118,.2);--chipq:rgba(156,166,178,.2);
--shadow:0 1px 2px rgba(0,0,0,.5);
--bezel:#4A525D;--scr:#111417;--scard:#22272D;--sline:#3A414A;--stext:#DDE2E8;--spill:#2F353D}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font:16.5px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0 auto;padding:0 16px;max-width:560px;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
h1{font-size:26px;line-height:1.2;margin:14px 0 14px;letter-spacing:-.01em}
h2{font-size:21px;line-height:1.25;margin:14px 0 14px;display:flex;align-items:center;gap:12px}
p{margin:0 0 12px}
.sm{font-size:14.5px;color:var(--muted)}
.lead{color:var(--muted);margin:4px 2px 16px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none}
/* who is talking: the app's mark, its name, the language switch */
.top{display:flex;align-items:center;gap:12px;padding:14px 0 12px}
.mark{flex:none;width:44px;height:44px;border-radius:11px;overflow:hidden;box-shadow:var(--shadow)}
.mark svg{display:block;width:100%;height:100%}
.who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.who b{font-size:18px;letter-spacing:-.01em}
.who small{font-size:13px;color:var(--muted)}
.globe{flex:none;position:relative;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);background:var(--surface);box-shadow:var(--shadow)}
.globe select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px}
.dots{list-style:none;display:flex;gap:6px;margin:2px 0 6px;padding:0}
.dots li{flex:1;height:5px;border-radius:3px;background:var(--line)}
.dots li.was{background:var(--brand);opacity:.45}
.dots li.now{background:linear-gradient(90deg,#0E9AA7,#48B89F 60%,#F5A65B)}
[dir=rtl] .dots li.now{background:linear-gradient(270deg,#0E9AA7,#48B89F 60%,#F5A65B)}
main{flex:1;display:flex;flex-direction:column}
.scr{flex:1;display:flex;flex-direction:column}
.n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:inline-flex;align-items:center;justify-content:center;font-size:17px;font-weight:700}
.card{background:var(--surface);border-radius:18px;padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.card>:last-child,.card>.btn:last-child{margin-bottom:0}
/* the code both phones show */
.pairing{position:relative;background:var(--surface);border-radius:18px;padding:18px 16px 16px;margin:0 0 14px;box-shadow:var(--shadow);text-align:center;overflow:hidden}
.pairing::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,#0E9AA7,#48B89F 50%,#F5A65B 78%,#F0645C)}
.pairing small{display:block;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.code{display:block;font-size:44px;line-height:1.25;font-weight:700;letter-spacing:.22em;margin-inline-end:-.22em;font-variant-numeric:tabular-nums}
.pairing p{margin:4px 0 0;font-size:15px}
.trust{list-style:none;margin:0 0 14px;padding:4px 16px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow)}
.trust li{display:flex;gap:12px;padding:12px 0;align-items:flex-start}
.trust li+li{border-top:1px solid var(--line)}
.trust .ic{margin-top:2px;color:var(--brand)}
.trust .quiet{font-size:14px;color:var(--muted)}
.trust .quiet .ic{color:var(--muted)}
/* buttons */
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:10px 18px;border:0;border-radius:16px;background:var(--brand);color:var(--on-brand);font:inherit;font-weight:600;font-size:17px;line-height:1.25;text-align:center;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn:disabled{opacity:.4}
.btn:active{filter:brightness(.93)}
.btn.ghost{flex:0 0 auto;background:none;color:var(--brand);padding-inline:14px}
.btn.tone{background:var(--tint);color:var(--brand);width:100%;margin:0 0 12px}
.bar{position:sticky;bottom:0;display:flex;gap:8px;margin-top:auto;padding:14px 0 calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 72%,transparent)}
.busy .bar{display:none}
/* a name as it is written on the other phone */
.nb{white-space:nowrap}
.k{display:inline;white-space:normal;font-weight:650;background:var(--chip);border-radius:7px;padding:1px 6px;overflow-wrap:anywhere;-webkit-box-decoration-break:clone;box-decoration-break:clone}
:lang(ko){word-break:keep-all}
.k.q{font-weight:500;background:var(--chipq)}
.sep{display:inline-block;width:.42em;height:.42em;margin:0 .5em .08em;border-top:2px solid;border-inline-end:2px solid;opacity:.6;transform:rotate(45deg)}
[dir=rtl] .sep{transform:rotate(-45deg)}
.more{padding:0}
.more>summary{list-style:none;cursor:pointer;padding:16px;display:flex;align-items:flex-start;gap:12px;-webkit-tap-highlight-color:transparent}
.more>summary::-webkit-details-marker{display:none}
.more>summary>span{flex:1;min-width:0}
.more>summary::after{content:"";flex:none;width:9px;height:9px;margin:6px 4px 0;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
.more[open]>summary::after{transform:rotate(-135deg);margin-top:11px}
.more>summary~*{margin-inline:16px}
.more>:last-child{margin-bottom:16px}
details.note{margin:0 2px 14px;font-size:14.5px;color:var(--muted)}
details.note>summary{cursor:pointer;padding:4px 0}
details.note[open]>summary{margin-bottom:10px}
/* choosing and sending the file */
.pick{display:flex;align-items:center;gap:14px;min-height:84px;padding:16px;margin:0 0 14px;border-radius:18px;background:var(--tint);color:var(--brand);cursor:pointer;-webkit-tap-highlight-color:transparent}
.pick span{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.pick b{font-size:17px;font-weight:600;overflow-wrap:anywhere}
.pick small{font-size:14px;opacity:.85}
.pick.has{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.pick.has .ic{color:var(--brand)}
.warn{border-inline-start:4px solid var(--tap);font-weight:500}
.sending{text-align:center;padding:24px 16px}
.ring{position:relative;width:148px;height:148px;margin:0 auto 14px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .track{stroke:var(--line)}
.ring .fill{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;font-variant-numeric:tabular-nums}
.amount{font-weight:600;font-variant-numeric:tabular-nums;margin-bottom:4px}
#s-done{align-items:center;text-align:center;padding-top:28px}
#s-done .card{align-self:stretch;margin-top:auto;text-align:start}
.okay{width:112px;height:112px;margin:8px 0 10px;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.okay svg{display:block;width:100%;height:100%}
.okay .chk{stroke-dasharray:70;stroke-dashoffset:70;animation:draw .45s .3s ease-out forwards}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
footer{font-size:13px;color:var(--muted);opacity:.8;text-align:center;padding:6px 0 18px}
/* the in-app guide: one scrolling page */
.guide{padding-top:8px;padding-bottom:28px}
.guide .intro p{color:var(--muted)}
.lang{display:block;margin:0 0 6px;font-size:14px;color:var(--muted)}
.lang select{font:inherit;font-size:15px;padding:6px 8px;border-radius:9px;max-width:100%}
.step{margin-top:10px}
/* sketches of the other phone's screens: plain shapes, no logos */
.pair{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:0 0 12px}
.ph{flex:1 1 128px;min-width:0;max-width:196px;border-radius:22px;padding:3px;background:var(--bezel)}
.sc{position:relative;height:100%;min-width:0;min-height:150px;border-radius:19px;background:var(--scr);color:var(--stext);padding:16px 9px 10px;font-size:11.5px;line-height:1.3;display:flex;flex-direction:column;gap:7px}
.sc::before{content:"";position:absolute;top:6px;left:50%;width:24px;height:4px;margin-left:-12px;border-radius:2px;background:var(--sline)}
.ph.tall .sc{min-height:214px}
.tb{font-weight:600;display:flex;align-items:center;min-height:22px}
.tb.end{justify-content:flex-end}
.sp{flex:1}
.ln{display:block;height:7px;border-radius:4px;background:var(--sline);width:100%}
.ln.s{width:62%}.ln.b{height:12px;width:80%}
.down{align-self:center;width:8px;height:8px;margin:1px 0 5px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);box-shadow:5px 5px 0 -3px var(--muted)}
.mi.cd{align-self:stretch}
.menu.side{align-self:flex-start;height:100%;border-radius:0 11px 11px 0;margin:-16px 0 -10px -9px;padding-top:22px;width:80%}
[dir=rtl] .menu.side{border-radius:11px 0 0 11px;margin:-16px -9px -10px 0}
.menu .row{padding:6px 7px;background:none}
.menu .row .ic{color:var(--muted)}
.crumb .hl{padding:0 3px;border-radius:5px;color:var(--stext);font-weight:600}
.cd{background:var(--scard);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.hl{position:relative;box-shadow:0 0 0 2px var(--tap);border-radius:9px;animation:tap 1.8s ease-out infinite}
.hl::after{content:"";position:absolute;inset-inline-end:-8px;bottom:-10px;width:16px;height:16px;border-radius:50%;background:var(--halo);border:2px solid var(--tap)}
.kebab.hl::after,.av.hl::after,.tabs .hl::after,.crumb .hl::after{display:none}
@keyframes tap{0%{box-shadow:0 0 0 2px var(--tap),0 0 0 2px var(--halo)}70%,100%{box-shadow:0 0 0 2px var(--tap),0 0 0 10px transparent}}
@media (prefers-reduced-motion:reduce){.hl,.okay,.okay .chk{animation:none}.okay .chk{stroke-dashoffset:0}}
.pill{background:var(--spill);border-radius:14px;padding:7px;text-align:center;font-weight:600}
.pill.g{min-height:28px;opacity:.6}
.pill.hl{border-radius:14px}
.kebab{display:inline-block;padding:0 7px;font-size:17px;font-weight:700}
.av{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--sline)}
.av.hl{border-radius:50%}
.menu{align-self:flex-end;width:78%;background:var(--scard);border-radius:11px;padding:9px;display:flex;flex-direction:column;gap:7px;box-shadow:0 3px 10px rgba(20,26,33,.14)}
.menu.wide{width:88%}
.mi{padding:4px 5px;font-weight:600}
.dlg{background:var(--scard);border-radius:13px;padding:10px;display:flex;flex-direction:column;gap:8px;font-weight:600;box-shadow:0 3px 10px rgba(20,26,33,.14)}
.pb{height:4px;border-radius:2px;background:var(--sline)}.pb i{display:block;width:38%;height:100%;border-radius:2px;background:var(--brand)}
.btns{display:flex;justify-content:space-around;gap:10px;text-align:center}
.btns span{flex:1 1 auto;padding:4px 6px}
.g{opacity:.55}
.ck{display:flex;align-items:center;gap:7px;font-weight:400}
.ck span{flex:none;width:13px;height:13px;border-radius:50%;border:1.5px solid var(--muted)}
.fld{display:flex;align-items:center;gap:8px}.fld .ln{flex:1}.fld b{flex:none;font-weight:600}
.crumb{font-size:10.5px;overflow-wrap:anywhere;color:var(--muted)}
.row{display:flex;align-items:center;gap:7px;min-width:0;background:var(--scard);border-radius:9px;padding:7px}
.row bdi{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tick{flex:none;width:15px;height:15px;border-radius:50%;background:var(--brand);color:var(--on-brand);font-size:10px;display:inline-flex;align-items:center;justify-content:center}
.tick.o{background:none;border:1.5px solid var(--muted)}
.fold{flex:none;width:22px;height:16px;border-radius:3px;background:#F5C542}.fold.d{background:var(--sline)}
.tabs{display:flex;justify-content:space-between;background:var(--scard);border-radius:14px;padding:6px 8px}
.tabs{gap:5px}
.tabs span{flex:1 1 0;min-width:0;min-height:26px;border-radius:6px;background:var(--spill);text-align:center;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tabs span.hl{flex:none;background:none;padding:1px 5px;white-space:nowrap}
.tabs small{font-size:9px;font-weight:600}.help{padding-top:6px;padding-bottom:28px}
.help .intro p{color:var(--muted)}
.help .more>summary{font-weight:600;font-size:17px}
.help h3{font-size:17px;line-height:1.3;margin:18px 0 10px;display:flex;align-items:center;gap:10px}
.help h3 .n{width:26px;height:26px;font-size:14px}
.help .more>h3{margin-inline:16px}
.help ul{margin:0 0 12px;padding-inline-start:20px}
.help li{margin:0 0 6px}
.big{font-size:20px;font-weight:700}
.caution{border-inline-start:4px solid var(--tap);padding:8px 12px;background:var(--chip);border-radius:8px;font-size:15px}
.links{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.store{margin:6px 0 18px;flex-direction:column;gap:2px}
.store.off{opacity:.55}
.store small{font-size:12px;font-weight:500}
.site .step h2{font-size:20px}
.links a{padding:8px 14px;border-radius:999px;background:var(--surface);color:var(--muted);text-decoration:none;font-weight:600;font-size:15px;box-shadow:var(--shadow)}
.links a.on{background:var(--brand);color:var(--on-brand)}
.help a{color:var(--brand)}
.help a.store{color:var(--on-brand)}
.site footer{margin-top:18px;line-height:1.6}
@media (min-width:700px){.site{max-width:680px;padding-top:24px}}
.tb.big{font-size:14px;font-weight:700}
.tb .sp{flex:1}
.tb b{font-weight:600}
.tb .pill{padding:3px 8px;font-size:10.5px}
.sub{font-size:10px;font-weight:600;color:var(--muted);margin-top:2px}
.dot{flex:none;width:14px;height:14px;border-radius:4px;background:var(--sline)}
.dot.b{background:var(--brand)}
.minus{flex:none;width:13px;height:13px;border-radius:50%;background:var(--tap);position:relative}
.minus::after{content:"";position:absolute;left:3px;right:3px;top:5.5px;height:2px;background:#fff}
.tabs span.wide{flex:2 1 0}
.tabs span.round{flex:none;width:26px;border-radius:50%;padding:0}
.langs{list-style:none;padding:0;margin:0;columns:2}
.langs li{margin:0 0 10px}</style></head><body class="help site">

<script>
(function(){var have=['ar','de','en','es','fi','fr','it','ja','ko','nb','nl','pl','pt-BR','sv','tr','zh-Hans','zh-Hant'],want=navigator.languages||[navigator.language||'en'];
function pick(tag){var p=tag.replace('_','-').split('-'),b=p[0].toLowerCase(),r=p.slice(1).join('-').toUpperCase();
  if(b=='zh')return /TW|HK|MO|HANT/.test(r)?'zh-Hant':'zh-Hans';
  if(b=='pt')return 'pt-BR';if(b=='no'||b=='nn'||b=='nb')return 'nb';
  for(var i=0;i<have.length;i++)if(have[i].toLowerCase()==b)return have[i];return null}
for(var i=0;i<want.length;i++){var c=pick(want[i]);if(c){location.replace(c+'/index.html');return}}
location.replace('en/index.html')})();
</script></body></html>
